<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시안 4 · 하루씩 흐름</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="lab.css">
<style>
.heat{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(14px,1fr);gap:3px;margin:12px 0 4px;overflow-x:auto;padding-bottom:20px}
.heat button{appearance:none;border:0;padding:0;height:34px;border-radius:4px;background:var(--h0);cursor:pointer;position:relative}
.heat button.k1{background:var(--h1)}.heat button.k2{background:var(--h2)}.heat button.k3{background:var(--h3)}.heat button.k4{background:var(--h4)}.heat button.k5{background:var(--h5)}.heat button.k6{background:var(--h6)}
.heat button.wk::after{content:attr(data-l);position:absolute;top:38px;left:0;font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.heat button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.hk{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-3);margin:2px 0 10px}
.hk i{width:14px;height:10px;border-radius:2px;display:inline-block}
.days{display:flex;flex-direction:column;gap:10px}
.dy{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:grid;grid-template-columns:96px 132px minmax(0,1fr);gap:14px;padding:12px 14px;align-items:start;scroll-margin-top:70px}
@media (max-width:700px){.dy{grid-template-columns:76px minmax(0,1fr)}.dy .px{grid-column:2}}
.dy.flash{outline:2px solid var(--accent)}
.dy .dt b{display:block;font-size:20px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dy .dt span{font-size:12px;color:var(--ink-3)}
.dy .px{font-size:12px;color:var(--ink-2)}
.dy .px b{font-variant-numeric:tabular-nums}
.dy .bd{min-width:0;display:flex;flex-direction:column;gap:6px}
@media (max-width:700px){.dy .bd{grid-column:1/-1}}
.dy .hd{font-size:15px;font-weight:700;line-height:1.45}
.dy .gs{font-size:13px;color:var(--ink-2);line-height:1.55}
.cnt{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--ink-2)}
.cnt b{font-variant-numeric:tabular-nums;color:var(--ink)}
.ich{display:flex;flex-wrap:wrap;gap:4px}
details.all summary{cursor:pointer;font-size:13px;color:var(--accent-ink);list-style:none}
details.all summary::-webkit-details-marker{display:none}
.ev{list-style:none;margin:8px 0 0;padding:0;font-size:13px;display:grid;gap:7px}
.ev li{display:grid;grid-template-columns:96px 1fr;gap:8px}
.ev .w{color:var(--ink-3);font-size:12px}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { load, head, theme, foot, tip, fp, pct, esc, mdh, md, WHO, KIND, RES, RESK, RESI, CAT, DAY, tt, onResize } from './lab.js';
const D = await load();
tip();
const app = document.getElementById('app');
app.innerHTML = head(4, '하루씩 내려가며 보기', '날짜마다 한 줄: 그날 BTC가 어떻게 움직였고, 우리가 무엇을 말하고 고쳤는지. 맨 위 띠는 날마다 기록이 얼마나 많았는지입니다(진할수록 많음). 칸을 누르면 그날로 갑니다.') +
  `<main class="wrap"><div class="heat" id="heat" role="group" aria-label="날짜별 기록 수"></div><div class="hk">적음 <i style="background:var(--h1)"></i><i style="background:var(--h3)"></i><i style="background:var(--h5)"></i> 많음</div><div class="days" id="days"></div></main>` + foot(D);
theme();
const dayKey = t => { const d = new Date(t + 9 * 36e5); return d.toISOString().slice(0, 10); };
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const all = [
  ...D.items.timeline.map(r => ({ k: 'post', r })), ...D.items.ledger.map(r => ({ k: 'call', r })),
  ...D.items.ladder.map(r => ({ k: 'lv', r })), ...D.items.radar.map(r => ({ k: 'fix', r })),
];
const by = {};
for (const x of all) (by[dayKey(x.r.t)] ||= []).push(x);
const first = Math.min(...D.items.timeline.map(r => r.t)), keys = [];
for (let t = first; t <= D.built; t += DAY) keys.push(dayKey(t));
if (!keys.includes(dayKey(D.built))) keys.push(dayKey(D.built));
const px = D.px.BTC;
function btcDay(k) {
  const t0 = Date.parse(k + 'T00:00:00+09:00'), t1 = t0 + DAY;
  const ix = px.t.map((t, i) => i).filter(i => px.t[i] >= t0 - 4 * 36e5 && px.t[i] < t1);
  if (!ix.length) return null;
  const prev = ix[0] > 0 ? px.c[ix[0] - 1] : px.o[ix[0]];
  const c = ix.map(i => px.c[i]), lo = Math.min(...ix.map(i => px.l[i])), hi = Math.max(...ix.map(i => px.h[i]));
  return { o: prev, c: c[c.length - 1], lo, hi, s: c };
}
function candle(b) {
  if (!b) return '<span class="mute">가격 없음</span>';
  const W = 120, H = 44, mn = Math.min(b.lo, b.o), mx = Math.max(b.hi, b.o), Y = v => 3 + (mx - v) / (mx - mn || 1) * (H - 6);
  const pts = [b.o, ...b.s].map((v, i, arr) => `${i ? 'L' : 'M'}${(i / (arr.length - 1) * (W - 4) + 2).toFixed(1)},${Y(v).toFixed(1)}`).join('');
  const up = b.c >= b.o;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><line x1="0" x2="${W}" y1="${Y(b.o)}" y2="${Y(b.o)}" stroke="var(--line)" stroke-dasharray="2 3"/><path d="${pts}" fill="none" stroke="var(${up ? '--good' : '--critical'})" stroke-width="1.8"/></svg><div>BTC <b>${fp(b.c)}</b> <b class="${up ? 'pos' : 'neg'}">${pct(b.c / b.o - 1)}</b></div><div class="mute">범위 ${fp(b.lo)}–${fp(b.hi)}</div>`;
}
function render() {
  const mx = Math.max(...keys.map(k => (by[k] || []).length), 1);
  document.getElementById('heat').innerHTML = keys.map((k, i) => {
    const n = (by[k] || []).length, lv = n ? Math.min(6, 1 + Math.floor(n / mx * 5.99)) : 0, d = new Date(k + 'T00:00:00+09:00');
    return `<button type="button" class="k${lv} ${d.getDay() === 1 || i === 0 ? 'wk' : ''}" data-go="${k}" data-l="${k.slice(5).replace('-', '/')}" aria-label="${k} 기록 ${n}건" ${tt(`${k.slice(5)} (${WD[d.getDay()]})`, `기록 ${n}건`)}></button>`;
  }).join('');
  document.getElementById('days').innerHTML = [...keys].reverse().map(k => {
    const xs = by[k] || [], d = new Date(k + 'T00:00:00+09:00');
    const posts = xs.filter(x => x.k === 'post').map(x => x.r).sort((a, b) => (b.kind === 'research') - (a.kind === 'research') || b.t - a.t);
    const calls = xs.filter(x => x.k === 'call').map(x => x.r), lvs = xs.filter(x => x.k === 'lv').map(x => x.r), fx = xs.filter(x => x.k === 'fix').map(x => x.r);
    const cats = D.cats.filter(c => c.date === k);
    const iss = {}; for (const x of xs) for (const i of x.r.iss || []) iss[i] = (iss[i] || 0) + 1;
    const top = Object.entries(iss).sort((a, b) => b[1] - a[1]).slice(0, 4);
    const hl = posts[0];
    const rows = [...xs].sort((a, b) => a.r.t - b.r.t).map(({ k: t, r }) =>
      t === 'post' ? [r.t, `${WHO[r.who] || r.who} ${KIND[r.kind] || ''}`, `<b>${esc(r.title)}</b> ${esc(r.gist)}`] :
      t === 'call' ? [r.t, `판정 · ${r.a}`, esc(r.st) + (r.scored ? ` <span class="rb ${RESK[r.res]}">${RESI[RESK[r.res]]} ${RES[r.res]}</span>` : '')] :
      t === 'lv' ? [r.t, `가격선 · ${r.a}`, `<b>${fp(r.price)}</b> ${esc(r.label)}`] :
      [r.t, r.type, `${esc(r.a)} → <b>${esc(r.b)}</b>`]);
    return `<article class="dy" id="d${k}"><div class="dt"><b>${k.slice(5).replace('-', '/')}</b><span>${WD[d.getDay()]}요일</span></div><div class="px">${candle(btcDay(k))}</div>
    <div class="bd">${hl ? `<div class="hd">${esc(hl.title)}</div><div class="gs">${esc(hl.gist.slice(0, 160))}</div>` : `<div class="gs mute">이날은 리서치 글이 없습니다.</div>`}
    <div class="cnt"><span>글 <b>${posts.length}</b></span><span>판정 <b>${calls.length}</b></span><span>가격선 <b>${lvs.length}</b></span><span>정정·이견 <b>${fx.length}</b></span>${cats.length ? `<span>일정 <b>${cats.length}</b> ${esc(cats.map(c => c.ev).join(', ').slice(0, 60))}</span>` : ''}</div>
    ${top.length ? `<div class="ich">${top.map(([i, n]) => `<span class="chip">${esc(D.iss[i]?.label || i)} ${n}</span>`).join('')}</div>` : ''}
    ${rows.length ? `<details class="all"><summary>이날 기록 ${rows.length}건 모두 보기</summary><ul class="ev">${rows.map(r => `<li><span class="w">${mdh(r[0]).split(' ')[1]}<br>${esc(r[1])}</span><span>${r[2]}</span></li>`).join('')}</ul></details>` : ''}</div></article>`;
  }).join('');
}
app.addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (!b) return;
  const el = document.getElementById('d' + b.dataset.go); if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'start' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1400);
});
render();
</script>
</body>
</html>
