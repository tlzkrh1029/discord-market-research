<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>피드백 시안 19개</title>
<meta name="description" content="시장 기억장치 Claude 판에 피드백을 남기는 방법 19가지를 THESIS·주요 자리 위에 올려 본 클릭 가능한 시안.">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="lab.css">
<style>
/* 머리·이동 (lab.css가 바뀌어도 버티도록 필요한 것만 다시 둠) */
.lh{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.lh .wrap{display:flex;align-items:center;gap:6px 14px;padding-top:8px;padding-bottom:8px;flex-wrap:wrap}
.back{font-size:13px;text-decoration:none;white-space:nowrap}
.fsw{display:flex;gap:2px;flex:1 1 220px;min-width:0;overflow-x:auto;scrollbar-width:thin}
.fsw a{font-size:13px;min-width:30px;text-align:center;padding:3px 7px;border-radius:14px;text-decoration:none;color:var(--ink-2);white-space:nowrap;border:1px solid transparent;font-variant-numeric:tabular-nums}
.fsw a[aria-current]{background:var(--ink);color:var(--bg)}
.fsw a:hover{border-color:var(--line)}
.lt{margin:18px 0 10px}
.lt .no{font-size:12px;font-weight:700;color:var(--accent-ink);letter-spacing:.04em}
.lt h1{font-size:24px;letter-spacing:-.02em;margin:2px 0 6px;line-height:1.3}
.lt .q{margin:0;color:var(--ink-2);font-size:15px;max-width:900px}
[hidden]{display:none!important}
#view .scrollx{position:relative}
#view:focus{outline:none}
#view :is(a,button,input,select,textarea,summary,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dlg :is(a,button,input,select,textarea):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap}
.xt{margin-top:14px}.xb{margin-bottom:12px}
.h2{font-size:13px;font-weight:700;color:var(--ink-3);letter-spacing:.04em;margin:20px 0 8px}
.h3{font-size:15px;margin:0 0 8px;line-height:1.4}
.sm{font-size:12.5px}
.lnk{appearance:none;background:none;border:0;padding:2px 0;font:inherit;color:var(--accent-ink);cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:3px}
.lnk.sm{font-size:12px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.sm{font-size:12px;min-height:28px;padding:2px 8px}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;line-height:22px;padding:0 9px;border-radius:11px;border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.pill.mock{background:color-mix(in srgb,var(--s4) 22%,var(--surface));border-color:color-mix(in srgb,var(--s4) 70%,var(--surface))}
.pill.real{background:color-mix(in srgb,var(--good) 14%,var(--surface));border-color:color-mix(in srgb,var(--good) 70%,var(--surface))}
.pill.local{background:color-mix(in srgb,var(--accent) 14%,var(--surface));border-color:color-mix(in srgb,var(--accent) 70%,var(--surface))}
.bdg{display:inline-flex;align-items:center;font-size:11px;font-weight:700;line-height:18px;padding:0 6px;border-radius:9px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;border:1px dashed var(--ink-3)}
.bdg.big{font-size:13px;line-height:24px;padding:0 10px}
.bdg.warn2{background:color-mix(in srgb,var(--critical) 12%,var(--surface));color:var(--ink);border:1px solid var(--critical)}
code,.code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
pre.out{margin:8px 0 0;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;font-family:var(--mono);font-size:12.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;max-height:320px;overflow:auto;color:var(--ink)}
.okmsg{margin:6px 0 0;font-size:13px;color:var(--ink-2)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.side{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
.side>aside{position:sticky;top:64px}
@media (max-width:900px){.two,.side{grid-template-columns:minmax(0,1fr)}.side>aside{position:static}}
.cmini{gap:8px}
.cmini .c1{flex-wrap:wrap}
.cmini .c1 h3{min-width:0}
.cmini .view{font-size:13.5px}
.cond li .cx{grid-column:1/-1}
.cond li>span:nth-child(2){min-width:0}
.fbb{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:30px;min-height:28px;padding:0 6px;cursor:pointer;font-size:14px;line-height:1;vertical-align:middle;color:var(--ink)}
.fbb:hover{border-color:var(--ink-3)}
.lines{margin:0;padding-left:20px;display:grid;gap:6px;font-size:13px}
/* 대화상자 */
.dlg{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:16px;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.dlg::backdrop{background:rgba(0,0,0,.45)}
.fbf{display:grid;gap:10px}
.seg{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.seg legend{font-size:12px;color:var(--ink-3);margin-bottom:4px;padding:0;width:100%}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:inline-block;border:1px solid var(--line);border-radius:16px;padding:3px 12px;font-size:13px;cursor:pointer;background:var(--surface)}
.seg input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg input:checked+span::before{content:"✓ "}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.fl{display:grid;gap:4px;font-size:12px;color:var(--ink-3)}
.fl>span{font-weight:600}
textarea,input[type=text],input[type=search],input[type=number]{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%;max-width:100%}
textarea{resize:vertical;min-height:64px}
/* 2 피드백 모드 */
.fbz.on [data-fid]{outline:1.5px dashed var(--accent);outline-offset:3px;cursor:pointer;border-radius:6px}
.fbz.on [data-fid]:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.fbz [data-fid].has::after{content:"✎ 메모 있음";grid-column:2;justify-self:start;font-size:11px;font-weight:700;line-height:18px;padding:0 6px;border-radius:9px;background:color-mix(in srgb,var(--s4) 26%,var(--surface));color:var(--ink)}
.notes{margin:0 0 10px;padding-left:20px;display:grid;gap:6px;font-size:13px}
/* 5 모형 창 */
.mockwin{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.mwbar{display:flex;gap:8px;align-items:center;padding:7px 10px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.mwbar .u{font-family:var(--mono);font-size:11.5px;flex:1;min-width:0;overflow-wrap:anywhere;color:var(--ink-2)}
.mwbody{padding:14px;display:grid;gap:10px}
.thread{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.thread li{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13.5px;background:var(--surface)}
.thread .w{font-size:12px;font-weight:700;color:var(--ink-2)}
.thread li.cl{background:color-mix(in srgb,var(--s2) 8%,var(--surface))}
/* 6 표 */
.tblw{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
.tblw th{font-weight:600;color:var(--ink-3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tblw td{padding:6px 8px;border-bottom:1px solid var(--surface-2);vertical-align:top}
.tblw select{min-height:28px;font-size:12px}
/* 7 문서 */
.doc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 24px;box-shadow:var(--shadow);font-size:15px;line-height:1.75}
@media (max-width:560px){.doc{padding:16px}}
.doc h3{font-size:20px;margin:0 0 4px}
.doc h4{font-size:14px;margin:16px 0 4px;color:var(--ink-2)}
.doc ol,.doc ul{padding-left:22px;margin:4px 0}
.doc li,.doc p{position:relative}
.doc mark{background:color-mix(in srgb,var(--s4) 30%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.doc mark.res{background:none;text-decoration:underline dotted var(--ink-3)}
.doc sup{font-size:10px;font-weight:700;color:var(--accent-ink);margin-left:1px}
:is(.doc,.cmts) del{color:var(--critical);text-decoration-thickness:2px}
:is(.doc,.cmts) ins{color:var(--good);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
:is(.doc,.cmts) del::before{content:"−";font-size:11px;font-weight:700}
:is(.doc,.cmts) ins::before{content:"+";font-size:11px;font-weight:700}
.addc{margin-left:4px;font-size:11px}
.cmts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.cmts li{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;background:var(--surface)}
.cmts li.done{opacity:.55}
.cmts .w{font-size:11.5px;color:var(--ink-3)}
/* 8 시뮬레이터 */
.ctl8{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 18px;margin-bottom:12px}
.ctl8 .fl input[type=range]{width:100%;accent-color:var(--accent)}
.ctl8 .fl b{font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.verdict{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:flex-end;margin:4px 0 12px}
.verdict .big{font-size:22px;font-weight:800;letter-spacing:-.01em}
.verdict .big.ok{color:var(--good)}.verdict .big.no{color:var(--critical)}
.sim{display:block;width:100%;height:auto;touch-action:pan-y}
.sim .gr{stroke:var(--line);stroke-width:1}
.sim .z{stroke:var(--ink-3);stroke-width:1}
.sim .ax{font-size:11px;fill:var(--ink-3);font-variant-numeric:tabular-nums}
.sim .band{fill:var(--accent);opacity:.14}
.sim .edge{stroke:var(--critical);stroke-width:1.4;stroke-dasharray:5 4}
.sim .ln{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.sim .br{fill:var(--critical)}
.sim .sg{fill:var(--critical);stroke:var(--surface);stroke-width:1.5}
.sim .sgt{font-size:11px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.sim .live{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.sim .xh{stroke:var(--ink-2);stroke-width:1}
.fbtip{position:absolute;z-index:60;display:none;max-width:280px;background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.5;padding:7px 9px;border-radius:8px;pointer-events:none}
.lg8{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2);margin:6px 0}
.lg8 span{display:inline-flex;align-items:center;gap:5px}
.lg8 i{display:inline-block;width:14px;height:10px;border-radius:2px}
.sigl{margin:8px 0 0;padding-left:22px;display:grid;gap:4px;font-size:13.5px}
.sigl b{font-variant-numeric:tabular-nums}
/* 9 버전 */
.vtl{display:flex;align-items:center;gap:0;margin:6px 0 14px;flex-wrap:wrap}
.vtl .nd{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--ink-2);min-width:84px}
.vtl .nd i{width:14px;height:14px;border-radius:50%;background:var(--ink);display:block}
.vtl .nd.p i{background:var(--surface);border:2px dashed var(--accent)}
.vtl .nd b{font-size:13px;color:var(--ink)}
.vtl .ln{flex:1 1 30px;min-width:24px;max-width:120px;height:2px;background:var(--line);margin-bottom:28px}
.vtl .ln.p{background:none;border-top:2px dashed var(--accent);height:0}
.vers{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;align-items:start}
.ver.p{border-style:dashed;border-color:var(--accent);border-width:2px}
.ver .vh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.ver .vh b{font-size:17px}
.dl{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px;font-size:13px}
.dl li{display:grid;grid-template-columns:auto 1fr;gap:6px}
.dl .s{font-weight:800;font-family:var(--mono)}
.dl .da .s{color:var(--good)}.dl .dd .s{color:var(--critical)}.dl .dc .s{color:var(--accent-ink)}
.dl .dd s{color:var(--ink-3)}
.ed{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ed li{border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:grid;gap:4px;font-size:13.5px}
.ed li.x{opacity:.6}
.ed li.x .tx{text-decoration:line-through}
.ed li.c{border-color:var(--accent)}
/* 10·11 */
.crow{display:grid;gap:8px;padding:10px 0;border-bottom:1px solid var(--surface-2)}
.crow:last-child{border-bottom:0}
.crow .hd{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;font-size:14px}
.crow .hd .t{flex:1 1 200px;min-width:0}
.meter{display:inline-flex;gap:2px;vertical-align:middle}
.meter i{width:12px;height:10px;border-radius:2px;background:var(--surface-2);border:1px solid var(--line);display:block}
.meter i.on{background:var(--accent);border-color:var(--accent)}
.sbar{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px;font-size:11.5px;font-weight:700}
.sbar span{display:flex;align-items:center;justify-content:center;min-width:0;white-space:nowrap;overflow:hidden;color:var(--ink)}
.sbar .k{background:color-mix(in srgb,var(--good) 30%,var(--surface))}
.sbar .e{background:color-mix(in srgb,var(--s4) 40%,var(--surface))}
.sbar .d{background:color-mix(in srgb,var(--critical) 28%,var(--surface))}
.sbar .n{background:var(--surface-2);color:var(--ink-3)}
.evl{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.evl li{font-size:13px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.evl li .t{flex:1 1 180px;min-width:0}
.addf{display:flex;gap:6px}
.addf input{flex:1;min-width:0}
/* 12 디스코드 모양 */
.dmsg{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;max-width:760px}
.ava{width:40px;height:40px;border-radius:50%;background:var(--s2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.dmsg .nm{font-weight:700}
.dmsg .tg{font-size:10px;font-weight:700;background:var(--accent);color:#fff;border-radius:3px;padding:0 4px;margin-left:4px;vertical-align:1px}
.dmsg .dtm{font-size:12px;color:var(--ink-3);margin-left:6px}
.embed{border-left:4px solid var(--accent);background:var(--surface-2);border-radius:4px;padding:10px 12px;margin-top:6px;font-size:13.5px;display:grid;gap:6px}
.embed ul{margin:0;padding-left:18px;display:grid;gap:3px}
.qr{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
/* 13·14·15 */
.acts{display:flex;flex-wrap:wrap;gap:4px}
.acts .btn{font-size:12px;min-height:28px;padding:2px 8px}
.mv{font-size:12px;font-weight:700;white-space:nowrap}
.mv.up{color:var(--good)}.mv.dn{color:var(--critical)}.mv.nw{color:var(--accent-ink)}
.divider{font-size:11.5px;color:var(--ink-3);text-align:center;border-top:1px dashed var(--ink-3);margin:6px 0 2px;padding-top:2px}
.diff{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 0;margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.diff div{padding:0 10px}
.diff .a{background:color-mix(in srgb,var(--good) 16%,transparent)}
.diff .r{background:color-mix(in srgb,var(--critical) 14%,transparent)}
.dnd{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.dnd li{display:grid;grid-template-columns:22px 26px minmax(0,1fr) auto auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13.5px}
.dnd li.divider{display:block;border:0;background:none;padding:2px 0;border-top:1px dashed var(--ink-3);border-radius:0;text-align:center;font-size:11.5px;color:var(--ink-3)}
.dnd li.drag{opacity:.4}
.dnd li.over{border-color:var(--accent);box-shadow:0 -3px 0 var(--accent)}
.dnd li.maj{border-left:3px solid var(--ink)}
.dnd .grip{cursor:grab;color:var(--ink-3);text-align:center;user-select:none;font-size:18px;line-height:1}
.dnd .rk{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.dnd .ud{display:flex;gap:2px}
.dnd .ud .btn{min-height:28px;padding:0 7px}
.wrow{display:grid;grid-template-columns:26px minmax(0,240px) minmax(0,1fr);gap:8px;align-items:center;font-size:13px;padding:3px 0}
.wrow .rk{font-weight:800;text-align:right}
.wrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:520px){.wrow{grid-template-columns:22px minmax(0,1fr);row-gap:2px}.wrow .barrow{grid-column:2}}
.sl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px}
.sl label{display:grid;gap:2px;font-size:13px}
.sl label span{display:flex;justify-content:space-between;gap:8px}
.sl input{width:100%;accent-color:var(--accent)}
.sw4{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* 16 */
.fgrid{display:grid;gap:12px;max-width:760px}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px 12px;font-size:13px}
.chk label{display:flex;gap:6px;align-items:center}
/* 17 보드 */
.kb{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:start}
@media (max-width:1000px){.kb{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}}
.kcol{margin:0;background:var(--surface-2);border-radius:10px;padding:8px;display:grid;gap:8px;min-width:0}
.kcol h3{font-size:13px;margin:2px 4px;display:flex;justify-content:space-between}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;display:grid;gap:4px}
.kcard .t{font-weight:700;font-size:13.5px}
.kcard .w{font-size:12px;color:var(--ink-3)}
.kcard select{font-size:12px;min-height:28px;width:100%}
.trail{font-size:11.5px;color:var(--ink-2);margin:0;padding-left:16px}
/* 18 빌드 */
.blds{display:grid;gap:12px}
.bld{margin:0}
.bld.p{border-style:dashed;border-width:2px;border-color:var(--accent)}
.bld .bh{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin-bottom:8px}
.ba{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr);gap:8px;align-items:stretch;margin-top:8px}
.ba>div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px}
.ba .bf{background:var(--surface-2);color:var(--ink-2)}
.ba .af{background:color-mix(in srgb,var(--good) 9%,var(--surface))}
.ba .ar{display:flex;align-items:center;justify-content:center;border:0;padding:0;font-weight:800;color:var(--ink-3)}
.ba small{display:block;font-size:11px;font-weight:700;color:var(--ink-3);margin-bottom:2px}
@media (max-width:520px){.ba{grid-template-columns:minmax(0,1fr)}.ba .ar{transform:rotate(90deg);height:20px}}
.banner{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--good) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--good) 50%,var(--surface));border-radius:10px;padding:8px 12px;font-size:13.5px}
/* 19 */
.idt,.cnt{display:none}
.ids .idt{display:inline-flex;align-items:center;font-family:var(--mono);font-size:11px;line-height:18px;padding:0 6px;border-radius:5px;background:var(--ink);color:var(--bg);border:0;cursor:pointer;vertical-align:1px;white-space:nowrap}
.ids .cnt{display:inline-flex}
.ids [data-fid]{outline:1px solid color-mix(in srgb,var(--ink) 25%,transparent);outline-offset:3px;border-radius:6px}
/* 0 목록 */
.grp{margin:20px 0}
.grp>h2{font-size:14px;color:var(--ink);letter-spacing:0;margin-bottom:8px}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.oc{display:grid;gap:4px;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.oc:hover{border-color:var(--ink-3)}
.oc .n{font-size:12px;font-weight:700;color:var(--accent-ink)}
.oc b{font-size:15.5px;line-height:1.35}
.oc p{margin:0;font-size:13px;color:var(--ink-2)}
.oc .row{margin-top:4px}
.pn{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:26px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:14px}
.pn a{text-decoration:none;max-width:48%}
.pn a.c{max-width:none}
@media (max-width:520px){.pn a{max-width:100%}}
</style>
</head>

</div></header>
