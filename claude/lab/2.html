<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시안 2 · 질문 여섯 개</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="lab.css">
<style>
.qs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:14px}
@media (max-width:860px){.qs{grid-template-columns:1fr}}
.qc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.qc .qn{font-size:12px;font-weight:700;color:var(--ink-3)}
.qc h2{font-size:19px;color:var(--ink);letter-spacing:-.01em;margin:0;display:block}
.qc .ans{font-size:15px;line-height:1.55;margin:0}
.qc .ans b{font-variant-numeric:tabular-nums}
.qc svg{display:block;width:100%;height:auto}
.qc .more{font-size:13px;margin-top:auto}
.lad text{font-size:11.5px;fill:var(--ink-2);font-variant-numeric:tabular-nums}
.lad .now{fill:var(--ink);font-weight:700}
.lad .tick{stroke-width:3}
.waf{display:flex;flex-direction:column;gap:6px}
.waf .r{display:grid;grid-template-columns:54px 1fr;gap:8px;align-items:center;font-size:12px;color:var(--ink-2)}
.waf .sq{display:flex;flex-wrap:wrap;gap:3px}
.waf .sq i{width:14px;height:14px;border-radius:3px;display:block;cursor:default}
.waf .sq i.good{background:var(--good)}.waf .sq i.warn{background:var(--warn)}.waf .sq i.mute{background:var(--h0);outline:1px solid var(--line);outline-offset:-1px}.waf .sq i.bad{background:var(--critical)}.waf .sq i.live{background:var(--accent)}
.cal{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.cal .d{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--ink-3);min-width:0}
.cal .d .n{width:100%;aspect-ratio:1/1.2;border-radius:5px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--ink)}
.cal .d.today .n{outline:2px solid var(--ink)}
.cal .d .n.k1{background:var(--h1)}.cal .d .n.k2{background:var(--h3);color:#fff}.cal .d .n.k3{background:var(--h5);color:#fff}
:root[data-theme="dark"] .cal .d .n.k3{color:#0b0b0b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cal .d .n.k3{color:#0b0b0b}}
.lst{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13.5px}
.lst li{display:grid;grid-template-columns:62px 1fr;gap:8px}
.lst .w{color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.dd text{font-size:12px;fill:var(--ink-2)}
.dd .a{stroke:var(--ink-3);stroke-width:2}
.dd .p0{fill:var(--surface);stroke:var(--ink-3);stroke-width:2}
.dd .p1{fill:var(--s1)}
.cols text{font-size:11px;fill:var(--ink-3)}
.cols .c1{fill:var(--s2)}.cols .c2{fill:var(--s3)}.cols .c3{fill:var(--s1)}.cols .c4{fill:var(--ink-3)}
.arr{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:13.5px}
.arr li{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:baseline}
.arr .to{color:var(--ink-3)}
.arr .why{flex-basis:100%;font-size:12px;color:var(--ink-3)}
.badge{font-size:11px;padding:0 6px;border-radius:8px;border:1px solid var(--line);color:var(--ink-2)}
.badge.ok{border-color:var(--good);color:var(--good)}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { load, head, theme, foot, tip, clusters, last, chg, fp, pct, esc, mdh, md, WHO, RES, RESK, RESI, CAT, LGNAME, DAY, tt, onResize } from './lab.js';
const D = await load();
tip();
const app = document.getElementById('app');
app.innerHTML = head(2, '질문 여섯 개, 답 여섯 개', '탭을 고르는 대신, 이 칸을 열면 늘 궁금한 여섯 질문에 그림 하나와 한 문장으로 답합니다.') + `<main class="wrap"><div class="qs" id="qs"></div></main>` + foot(D);
theme();
const card = (n, q, ans, vis, more) => `<article class="qc"><span class="qn">질문 ${n}</span><h2>${q}</h2><p class="ans">${ans}</p>${vis}${more ? `<a class="more" href="${more[0]}">${more[1]} →</a>` : ''}</article>`;

function q1() {
  const a = 'BTC', now = last(D, a), W = 520, H = 300, rng = 0.08;
  const cl = clusters(D, a, { rng }).filter(c => Math.abs(c.d) <= rng);
  const top = [...cl].sort((x, y) => y.n - x.n).slice(0, 12);
  const Y = d => 16 + (rng - d) / (2 * rng) * (H - 32);
  const up = cl.filter(c => c.d > 0).sort((x, y) => x.d - y.d)[0], dn = cl.filter(c => c.d < 0).sort((x, y) => y.d - x.d)[0];
  const n5 = cl.filter(c => Math.abs(c.d) <= 0.05).reduce((s, c) => s + c.n, 0);
  const col = { sup: 's1', res: 's2', ma: 's3', liq: 's4', oth: 'ink-3' };
  let s = `<svg viewBox="0 0 ${W} ${H}" class="lad" role="img" aria-label="BTC 지금 가격 ±8% 안의 우리 가격선">`;
  for (const d of [-0.08, -0.04, 0, 0.04, 0.08]) s += `<line x1="70" x2="${W - 8}" y1="${Y(d)}" y2="${Y(d)}" stroke="var(--line)" ${d ? 'stroke-dasharray="2 4"' : ''}/><text x="62" y="${Y(d) + 4}" text-anchor="end">${d ? pct(d, 0) : ''}</text>`;
  // 막대 길이 = 언급 횟수
  const mx = Math.max(...top.map(c => c.n), 1);
  let lastY = -99;
  for (const c of top.sort((x, y) => y.d - x.d)) {
    const y = Y(c.d), w = 30 + c.n / mx * 150, showL = Math.abs(y - lastY) > 13;
    s += `<g ${tt(`${fp(c.p)} (${pct(c.d)}) · 언급 ${c.n}번`, c.label, LGNAME[c.gp])}><line class="tick" x1="78" x2="${78 + w}" y1="${y}" y2="${y}" stroke="var(--${col[c.gp]})" stroke-linecap="round"/><rect x="70" y="${y - 7}" width="${W - 78}" height="14" fill="transparent"/>${showL ? `<text x="${86 + w}" y="${y + 4}">${fp(c.p)} · ${esc(c.label.slice(0, 22))}</text>` : ''}</g>`;
    if (showL) lastY = y;
  }
  s += `<line x1="70" x2="${W - 8}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--ink)" stroke-width="2"/><rect x="${W - 112}" y="${Y(0) - 11}" width="104" height="22" rx="5" fill="var(--ink)"/><text x="${W - 60}" y="${Y(0) + 4}" text-anchor="middle" style="fill:var(--bg);font-weight:700">지금 ${fp(now)}</text></svg>`;
  return card(1, 'BTC 지금 가격 근처, 우리가 중요하다고 한 선은?',
    `위로 가장 가까운 선은 <b>${up ? fp(up.p) + ' (' + pct(up.d) + ')' : '없음'}</b>, 아래는 <b>${dn ? fp(dn.p) + ' (' + pct(dn.d) + ')' : '없음'}</b>. 지금 ±5% 안에서 우리가 말한 가격은 <b>${n5}번</b>입니다.`,
    s + `<div class="key"><span class="sup"><i></i>지지·고저점</span><span class="res"><i></i>저항</span><span class="ma"><i></i>이평·원가</span><span class="liq"><i></i>청산·옵션</span><span class="mute">막대 길이 = 말한 횟수</span></div>`, ['./1.html', '차트에서 보기']);
}
function q2() {
  const L = D.items.ledger.filter(r => r.scored);
  const by = w => L.filter(r => r.who === w).sort((x, y) => (RESK[x.res] > RESK[y.res]) - (RESK[x.res] < RESK[y.res]) || x.t - y.t);
  const cnt = (arr, k) => arr.filter(r => RESK[r.res] === k).length;
  const row = (name, arr) => `<div class="r"><span>${name} ${arr.length}</span><div class="sq">${arr.map(r => `<i class="${RESK[r.res]}" ${tt(`${mdh(r.t)} ${r.a} · ${CAT[r.cat]}`, r.st, '결과: ' + RES[r.res])}></i>`).join('')}</div></div>`;
  const g = cnt(L, 'good'), w = cnt(L, 'warn'), m = cnt(L, 'mute'), b = cnt(L, 'bad');
  return card(2, '우리 판정은 얼마나 맞았나?',
    `가격으로 채점할 수 있는 판정 <b>${L.length}개</b> 중 목표 도달 <b class="good">${g}</b>, 조건만 충족(목표 미도달) <b class="warn">${w}</b>, 조건이 오지 않음 <b>${m}</b>, 무효 <b class="bad">${b}</b>. 한 칸이 판정 하나입니다.`,
    `<div class="waf">${row('Claude', by('claude'))}${row('GPT', by('gpt'))}</div><div class="key"><span class="good"><i class="dot"></i>✓ 목표 도달</span><span class="warn"><i class="dot"></i>◐ 조건만 충족</span><span class="mute"><i class="dot"></i>· 조건 안 옴</span><span class="bad"><i class="dot"></i>✕ 무효</span></div>
    <p class="mute" style="font-size:12px;margin:0">"서술·설명"처럼 가격 조건이 없는 판정 ${D.items.ledger.length - L.length}개는 넣지 않았습니다. 적중률 하나로 합치지 않습니다.</p>`, ['../index.html#v=ledger', '판정 원장']);
}
function q3() {
  const t0 = Math.floor((D.built + 9 * 36e5) / DAY) * DAY - 9 * 36e5;
  const days = [...Array(14)].map((_, i) => t0 + i * DAY);
  const ev = d => D.cats.filter(c => c.t >= d && c.t < d + DAY);
  const nx = D.cats.filter(c => c.t >= D.built).slice(0, 6);
  const dd = c => { const k = Math.floor((c.t - t0) / DAY); return k <= 0 ? '오늘' : 'D-' + k; };
  return card(3, '앞으로 2주, 무엇을 확인해야 하나?',
    `14일 동안 잡힌 일정 <b>${D.cats.filter(c => c.t >= t0 && c.t < t0 + 14 * DAY).length}개</b>. 가장 가까운 것은 <b>${nx[0] ? esc(nx[0].ev) + ' (' + dd(nx[0]) + ')' : '없음'}</b>입니다.`,
    `<div class="cal">${days.map((d, i) => { const e = ev(d); return `<div class="d ${i ? '' : 'today'}" ${e.length ? tt(md(d) + ' 일정 ' + e.length + '개', ...e.map(c => (c.time || '') + ' ' + c.ev)) : ''}><span class="n k${Math.min(3, e.length)}">${e.length || ''}</span><span>${md(d)}</span></div>`; }).join('')}</div>
    <ul class="lst">${nx.map(c => `<li><span class="w">${dd(c)}<br>${c.date.slice(5)}${c.time ? ' ' + c.time : ''}</span><span>${esc(c.ev)}${c.exp ? `<br><span class="w">${esc(c.exp)}</span>` : ''}</span></li>`).join('')}</ul>`, ['./4.html', '하루씩 보기']);
}
function q4() {
  const end = D.built, a0 = end - 7 * DAY, b0 = end - 14 * DAY;
  const all = [...D.items.timeline, ...D.items.ledger, ...D.items.ladder, ...D.items.radar];
  const rows = D.meta.issues.filter(i => !i.fixed).map(i => {
    const it = all.filter(r => (r.iss || []).includes(i.id));
    return { i, now: it.filter(r => r.t > a0).length, pre: it.filter(r => r.t > b0 && r.t <= a0).length };
  }).filter(r => r.now + r.pre).sort((x, y) => y.now - x.now).slice(0, 8);
  const mx = Math.max(...rows.map(r => Math.max(r.now, r.pre)), 1), W = 520, rh = 30, H = rows.length * rh + 26, x0 = 170, X = v => x0 + v / mx * (W - x0 - 40);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="dd" role="img" aria-label="사안별 최근 7일과 그 전 7일 기록 수">`;
  rows.forEach((r, k) => {
    const y = 14 + k * rh;
    s += `<g ${tt(r.i.label, `최근 7일 ${r.now}건 · 그 전 7일 ${r.pre}건`)}><rect x="0" y="${y - 12}" width="${W}" height="${rh - 4}" fill="transparent"/><text x="0" y="${y + 4}">${esc(r.i.label.slice(0, 14))}</text><line class="a" x1="${X(r.pre)}" x2="${X(r.now)}" y1="${y}" y2="${y}"/><circle class="p0" cx="${X(r.pre)}" cy="${y}" r="5"/><circle class="p1" cx="${X(r.now)}" cy="${y}" r="6"/><text x="${X(Math.max(r.now, r.pre)) + 10}" y="${y + 4}" style="fill:var(--ink);font-weight:700">${r.now}</text></g>`;
  });
  s += `</svg>`;
  const upMost = [...rows].sort((x, y) => (y.now - y.pre) - (x.now - x.pre))[0];
  return card(4, '요즘 무엇을 가장 많이 말하나?',
    `최근 7일 가장 많이 다룬 사안은 <b>${esc(rows[0]?.i.label || '—')}</b>(${rows[0]?.now || 0}건). 그 전 주보다 가장 많이 늘어난 것은 <b>${esc(upMost?.i.label || '—')}</b>(${upMost?.pre}→${upMost?.now}).`,
    s + `<div class="key"><span><svg width="12" height="12"><circle cx="6" cy="6" r="4.5" fill="var(--surface)" stroke="var(--ink-3)" stroke-width="2"/></svg>그 전 7일</span><span style="color:var(--s1)"><i class="dot"></i>최근 7일</span><span class="mute">글·판정·가격선·정정 수</span></div>`, ['./3.html', '사안별 이야기']);
}
function q5() {
  const R = D.items.radar, wk = t => Math.floor((t - kst0) / (7 * DAY)), kst0 = Math.min(...R.map(r => r.t));
  const typ = r => r.type === '이견' ? 4 : r.who === 'gpt' && r.tgt === 'claude' ? 1 : r.who === 'claude' && r.tgt === 'claude' ? 3 : 2;
  const NAMES = { 1: 'GPT가 Claude를 정정', 2: '그 밖의 정정', 3: 'Claude 스스로 정정', 4: '이견' };
  const nW = wk(D.built) + 1, cols = [...Array(nW)].map((_, w) => [1, 2, 3, 4].map(k => R.filter(r => wk(r.t) === w && typ(r) === k).length));
  const W = 520, H = 170, mx = Math.max(...cols.map(c => c.reduce((s, v) => s + v, 0)), 1), bw = (W - 20) / nW - 10;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="cols" role="img" aria-label="주별 정정·이견 수">`;
  cols.forEach((c, w) => {
    let y = H - 22; const x = 10 + w * (bw + 10);
    c.forEach((v, k) => { if (!v) return; const h = v / mx * (H - 40); y -= h; s += `<rect class="c${k + 1}" x="${x}" y="${y}" width="${bw}" height="${Math.max(0, h - 2)}" rx="3" ${tt(`${md(kst0 + w * 7 * DAY)}~ 주`, `${NAMES[k + 1]} ${v}건`)}/>`; });
    s += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${md(kst0 + w * 7 * DAY)}~</text><text x="${x + bw / 2}" y="${y - 5}" text-anchor="middle" style="fill:var(--ink);font-weight:700">${c.reduce((a, b) => a + b, 0)}</text>`;
  });
  s += `</svg>`;
  const lastFix = R.filter(r => r.type === '정정').sort((x, y) => y.t - x.t).slice(0, 3);
  return card(5, '누가 무엇을 고쳤나?',
    `정정 <b>${R.filter(r => r.type === '정정').length}건</b>, 이견 <b>${R.filter(r => r.type === '이견').length}건</b>. 그중 GPT가 Claude를 바로잡은 것이 <b>${R.filter(r => typ(r) === 1).length}건</b>, Claude가 스스로 고친 것이 <b>${R.filter(r => typ(r) === 3).length}건</b>입니다.`,
    s + `<div class="key"><span style="color:var(--s2)"><i class="dot"></i>GPT→Claude 정정</span><span style="color:var(--s1)"><i class="dot"></i>Claude 자기 정정</span><span style="color:var(--s3)"><i class="dot"></i>그 밖의 정정</span><span style="color:var(--ink-3)"><i class="dot"></i>이견</span></div>
    <ul class="arr">${lastFix.map(r => `<li><span class="w mute" style="font-size:12px">${mdh(r.t)}</span><span>${esc(r.a)}</span><span class="to">→</span><b>${esc(r.b)}</b></li>`).join('')}</ul>`, ['../index.html#v=radar', '정정·이견 레이더']);
}
function q6() {
  const C = D.items.contagion, ok = C.filter(c => c.st === '확인').length;
  const recent = [...C].reverse().slice(0, 6);
  return card(6, '무엇이 무엇을 움직인다고 봤나?',
    `원인→결과로 말한 연결 <b>${C.length}개</b> 중 실제로 확인된 것은 <b>${ok}개</b>뿐이고, 나머지 ${C.length - ok}개는 추정입니다.`,
    `<svg viewBox="0 0 520 26" role="img" aria-label="확인 ${ok}, 추정 ${C.length - ok}"><rect x="0" y="4" width="${ok / C.length * 520 - 2}" height="18" rx="4" fill="var(--good)"/><rect x="${ok / C.length * 520}" y="4" width="${(1 - ok / C.length) * 520}" height="18" rx="4" fill="var(--h1)"/><text x="8" y="17" style="font-size:11.5px;fill:#fff;font-weight:700">확인 ${ok}</text><text x="${ok / C.length * 520 + 8}" y="17" style="font-size:11.5px;fill:var(--ink)">추정 ${C.length - ok}</text></svg>
    <ul class="arr">${recent.map(c => `<li><b>${esc(c.a)}</b><span class="to">→</span><b>${esc(c.b)}</b><span class="badge ${c.st === '확인' ? 'ok' : ''}">${c.st}</span><span class="why">${esc(c.how || '')}</span></li>`).join('')}</ul>`, ['../index.html#v=contagion', '전염 지도']);
}
function render() { document.getElementById('qs').innerHTML = q1() + q2() + q3() + q4() + q5() + q6(); }
render(); onResize(render);
</script>
</body>
</html>
